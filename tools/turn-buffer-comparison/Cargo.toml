[package]
name = "turn-buffer-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
util = { package = "webrtc-util", version = "0.12", features = ["conn"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
