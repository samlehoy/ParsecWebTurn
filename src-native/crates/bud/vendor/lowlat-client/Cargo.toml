[package]
name = "lowlat-client"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/nomi-san/lowlat"
authors = ["Nguyen Duy"]

[features]
default = []
external-video = []
usb-hid-input = []
input-trace = []
turn-stream = ["lowlat-net/turn-stream"]

[dependencies]
lowlat-common = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86" }
lowlat-core = { path = "../lowlat-core" }
lowlat-net = { path = "../lowlat-net" }
lowlat-crypto = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86" }
zeroize = "1"
