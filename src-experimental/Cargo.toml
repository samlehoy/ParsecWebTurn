[package]
name = "parsec-native-experimental"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
gpu-probes = ["dep:windows", "dep:lowlat-drivers", "dep:lowlat-decode"]

[[bin]]
name = "intel-gpu-probe"
path = "src/bin/intel-gpu-probe.rs"
required-features = ["gpu-probes"]

[[bin]]
name = "vendor-gpu-probe"
path = "src/bin/vendor-gpu-probe.rs"
required-features = ["gpu-probes"]

[[bin]]
name = "mf-baseline-probe"
path = "src/bin/mf-baseline-probe.rs"
required-features = ["gpu-probes"]

[workspace]
members = ["vendor/lowlat-client", "vendor/lowlat-net"]
resolver = "2"

# Deliberately independent from src-native: no change to the WebRTC binary.
[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
lowlat-client = { path = "vendor/lowlat-client", features = ["external-video"] }
lowlat-core = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86" }
lowlat-crypto = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86" }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D10", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant"] }
lowlat-drivers = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86", optional = true }
lowlat-decode = { git = "https://github.com/nomi-san/lowlat", rev = "5f8db5689e55de0d396b0520824caa9fc053dd86", optional = true }

[profile.release]
lto = "fat"
codegen-units = 1

