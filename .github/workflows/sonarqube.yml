name: SonarQube Analysis

on:
  push:
    branches:
      - '**'
      - '!legacy'

  pull_request:
    branches:
      - '**'
      - '!legacy'
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    # Also exclude a manual dispatch explicitly targeted at legacy.
    if: github.ref != 'refs/heads/legacy'
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan and required Quality Gate
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          # A successful upload is insufficient: fail on a red gate or timeout.
          # The project's configured Sonar way gate owns the quality thresholds.
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
