name: SonarQube Analysis

on:
  push:
    branches:
      - '**'
      - '!legacy'

  pull_request:
    branches:
      - '**'
      - '!legacy'
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Measured Rust and packaging coverage
    if: github.ref != 'refs/heads/legacy'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-native
          key: sonar-instrumented
      - name: Install pinned measurement tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'cargo-llvm-cov-0.9.1.zip'
          Invoke-WebRequest 'https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '656590cfa13bb7478595bbfdd3bc6bc075a4f7f3f0df5a439c1856cb03c5a4d2') { throw 'Coverage tool digest mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'cargo-llvm-cov-0.9.1'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $destination | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Install-Module Pester -RequiredVersion 5.7.1 -Repository PSGallery -Scope CurrentUser -Force -AllowClobber
      - name: Prepare the normal optional vendor SDK
        shell: pwsh
        run: ./scripts/fetch-rtx-video-sdk.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'rtx-video-sdk-1.1.0')
      - name: Measure actual Rust test execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path coverage -Force | Out-Null
          cargo llvm-cov --locked --manifest-path src-native/Cargo.toml --target x86_64-pc-windows-msvc --lcov --output-path coverage/rust-raw.info -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Instrumented Rust tests failed' }
          # The package must contain the normal executable, never an instrumented build.
          cargo clean --manifest-path src-native/Cargo.toml --release -p libopus_sys
          if ($LASTEXITCODE -ne 0) { throw 'Release Opus cache reset failed' }
          cargo build --locked --release --manifest-path src-native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Normal packaging executable build failed' }
      - name: Measure real release packaging and convert reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -RequiredVersion 5.7.1
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './ci-tests/Package.Tests.ps1'
          $configuration.Run.Throw = $true
          $configuration.Run.PassThru = $true
          $configuration.CodeCoverage.Enabled = $true
          $configuration.CodeCoverage.Path = './scripts/package-native.ps1'
          $configuration.CodeCoverage.OutputPath = './coverage/pester.xml'
          $configuration.CodeCoverage.OutputFormat = 'JaCoCo'
          $result = Invoke-Pester -Configuration $configuration
          if ($result.FailedCount -gt 0) { throw 'Packaging tests failed' }
          @'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          generic = ET.Element('coverage', version='1')
          measured = ET.SubElement(generic, 'file', path='scripts/package-native.ps1')
          sources = [node for node in ET.parse('coverage/pester.xml').iter('sourcefile') if node.get('name', '').replace('\\', '/').rsplit('/', 1)[-1] == 'package-native.ps1']
          assert len(sources) == 1, 'Missing or ambiguous actual packaging coverage'
          lines = sources[0].findall('line')
          assert lines and any(int(line.get('ci', '0')) > 0 for line in lines), 'Empty packaging execution report'
          for line in lines:
              ET.SubElement(measured, 'lineToCover', lineNumber=line.attrib['nr'], covered=str(int(line.get('ci', '0')) > 0).lower())
          ET.ElementTree(generic).write('coverage/powershell.xml', encoding='utf-8', xml_declaration=True)
          output = []
          keep = False
          for line in Path('coverage/rust-raw.info').read_text(encoding='utf-8').splitlines():
              if line.startswith('SF:'):
                  source = Path(line[3:])
                  if not source.is_absolute():
                      source = root / source
                  try:
                      relative = source.resolve().relative_to(root).as_posix()
                  except ValueError:
                      keep = False
                      continue
                  line = 'SF:' + relative
                  keep = True
              if keep:
                  output.append(line)
          assert any(line.startswith('SF:src-native/src/') for line in output), 'Missing native Rust coverage'
          Path('coverage/rust.info').write_text('\n'.join(output) + '\n', encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Measured coverage conversion failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: sonar-measured-coverage
          path: coverage/*
          if-no-files-found: error

  sonarqube:
    needs: coverage
    # Also exclude a manual dispatch explicitly targeted at legacy.
    if: github.ref != 'refs/heads/legacy'
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - uses: actions/download-artifact@v4
        with:
          name: sonar-measured-coverage
          path: coverage
      - name: SonarQube Scan and required Quality Gate
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        with:
          # A successful upload is insufficient: fail on a red gate or timeout.
          # The project's configured Sonar way gate owns the quality thresholds.
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
            -Dsonar.coverageReportPaths=coverage/powershell.xml
            -Dsonar.rust.lcov.reportPaths=coverage/rust.info
            -Dsonar.tests=ci-tests
            -Dsonar.exclusions=ci-tests/**,coverage/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
