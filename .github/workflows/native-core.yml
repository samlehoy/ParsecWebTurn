name: EvoParseq native client

on:
  workflow_dispatch:
    inputs:
      compare_video_logging:
        description: Build an isolated logging-only A/B comparison
        type: boolean
        default: false
  push:
    branches: [codex/native-core]

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 16
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-native
          cache-on-failure: true
      - name: Verify native-only build without a proprietary core file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath src-native/vendor/parsecd.wasm) {
            Remove-Item -LiteralPath src-native/vendor/parsecd.wasm
          }
          cargo fmt --manifest-path src-native/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          $nativeTree = cargo tree --locked --manifest-path src-native/Cargo.toml --no-default-features --features native-core,vendor-video --edges normal,build --prefix none
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency audit failed' }
          if ($nativeTree | Select-String '^(wasmtime|cranelift|glow|lowlat-(sdk|host|daemon|capture|encode))') { throw 'Unexpected legacy/host dependency in native runtime build' }
          # The upstream Opus buildscript does not track CMake toolchain changes.
          # Do not reuse /MD objects restored from an older dependency cache.
          cargo clean --manifest-path src-native/Cargo.toml -p libopus_sys
          if ($LASTEXITCODE -ne 0) { throw 'Opus cache reset failed' }
          cargo clean --manifest-path src-native/Cargo.toml --release -p libopus_sys
          if ($LASTEXITCODE -ne 0) { throw 'Release Opus cache reset failed' }
          $env:PWT_NATIVE_UI_CAPTURE = Join-Path (Get-Location) "dist/native-core/session-panel.png"
          cargo test --locked --manifest-path src-native/crates/bud/Cargo.toml -p lowlat-client --features external-video,turn-stream,usb-hid-input -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'BUD control and HID regression tests failed' }
          cargo test --locked --manifest-path src-native/Cargo.toml --no-default-features --features native-core,vendor-video -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native core and shared regression tests failed' }
          cargo build --locked --release --manifest-path src-native/Cargo.toml --no-default-features --features native-core,vendor-video
          if ($LASTEXITCODE -ne 0) { throw 'Native core build failed' }
          New-Item -ItemType Directory -Path dist/native-core -Force | Out-Null
          $nativeTree | Set-Content -LiteralPath dist/native-core/dependencies.txt -Encoding utf8
          Copy-Item -LiteralPath src-native/target/x86_64-pc-windows-msvc/release/evoparseq.exe -Destination dist/native-core/EvoParseq.exe
          & ./dist/native-core/EvoParseq.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Native version probe failed' }
          Copy-Item -LiteralPath docs/native-core.md -Destination dist/native-core/README.md
          Copy-Item -LiteralPath LICENSE -Destination dist/native-core/LICENSE
          Copy-Item -LiteralPath src-native/crates/bud/vendor/lowlat-client/LICENSE -Destination dist/native-core/LOWLAT-LICENSE.txt
          git rev-parse HEAD | Set-Content -LiteralPath dist/native-core/SOURCE.txt -Encoding ascii
          Get-FileHash -Algorithm SHA256 dist/native-core/EvoParseq.exe | Format-List | Out-String | Set-Content -LiteralPath dist/native-core/SHA256.txt
      - name: Build logging-only comparison (same source, toolchain and flags)
        if: github.event_name == 'workflow_dispatch' && inputs.compare_video_logging
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/logging-comparison/A,dist/logging-comparison/B -Force | Out-Null
          Copy-Item dist/native-core/EvoParseq.exe dist/logging-comparison/A/EvoParseq.exe
          $revision = git rev-parse HEAD
          $compiler = rustc -vV | Out-String
          @("Variant A: current extended video logging", "Source: $revision", $compiler) | Set-Content dist/logging-comparison/A/SOURCE.txt
          try {
            python .github/scripts/without-extended-video-log.py
            if ($LASTEXITCODE -ne 0) { throw 'Comparison source patch failed' }
            cargo fmt --manifest-path src-native/Cargo.toml -- --check
            if ($LASTEXITCODE -ne 0) { throw 'Comparison formatting failed' }
            cargo test --locked --manifest-path src-native/Cargo.toml --no-default-features --features native-core,vendor-video -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { throw 'Comparison regression tests failed' }
            cargo build --locked --release --manifest-path src-native/Cargo.toml --no-default-features --features native-core,vendor-video
            if ($LASTEXITCODE -ne 0) { throw 'Comparison build failed' }
            Copy-Item src-native/target/x86_64-pc-windows-msvc/release/evoparseq.exe dist/logging-comparison/B/EvoParseq.exe
            @("Variant B: only recent extended video logging removed", "Source: $revision plus source.patch", $compiler) | Set-Content dist/logging-comparison/B/SOURCE.txt
            foreach ($variant in @('A','B')) {
              Get-FileHash "dist/logging-comparison/$variant/EvoParseq.exe" -Algorithm SHA256 | Format-List | Out-String | Set-Content "dist/logging-comparison/$variant/SHA256.txt"
            }
          } finally {
            git restore -- src-native/src/attempt.rs src-native/src/bud_attempt.rs src-native/src/stats.rs src-native/src/video_windows.rs
          }
          @(
            'A and B use the same build flags, dependencies and compiler. Only the recent video log additions differ.',
            'Both retain the BUD 4:4:4 flag fix and direct AYUV presentation. Earlier event logging remains in B.',
            'These are diagnostic comparison builds, not a stable release. Keep Defender enabled.',
            'Compare scan results before launching either file. Do not add antivirus exclusions for this test.',
            'Different results establish a build correlation, not that log-file writes caused the detection.',
            'If both differ from the previously quarantined build, hash/cloud reputation or build variability may be involved.',
            'B/source.patch records the complete source difference. SOURCE.txt records the compiler and source revision.'
          ) | Set-Content dist/logging-comparison/README.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.compare_video_logging
        with:
          name: EvoParseq-video-logging-comparison
          path: dist/logging-comparison/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || !inputs.compare_video_logging
        with:
          name: EvoParseq-win64
          path: dist/native-core/*
          if-no-files-found: error
