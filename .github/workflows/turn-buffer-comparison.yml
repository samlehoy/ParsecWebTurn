name: Isolated TURN buffer comparison
on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['tools/turn-buffer-comparison/**', '.github/workflows/turn-buffer-comparison.yml']
permissions:
  contents: read
jobs:
  compare:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/turn-buffer-comparison
      - name: Build isolated comparison
        shell: pwsh
        run: |
          cargo build --locked --release --target ${{ matrix.target }} --manifest-path tools/turn-buffer-comparison/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Comparison build failed' }
      - name: Exercise TCP and verified TLS policies
        shell: pwsh
        run: |
          $exe = 'tools/turn-buffer-comparison/target/${{ matrix.target }}/release/turn-buffer-comparison'
          if ('${{ matrix.os }}' -eq 'windows-latest') { $exe += '.exe' }
          & $exe comparison.json 2
          if ($LASTEXITCODE -ne 0) { throw 'Comparison failed' }
          & $exe calls.json 1 counted
          if ($LASTEXITCODE -ne 0) { throw 'Instrumented comparison failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: turn-buffer-comparison-${{ matrix.os }}
          path: |
            tools/turn-buffer-comparison/target/${{ matrix.target }}/release/turn-buffer-comparison.exe
            comparison.json
            calls.json
