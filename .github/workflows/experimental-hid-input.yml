name: Experimental HID input validation
on:
  workflow_dispatch:
  push:
    branches: [codex/usb-mouse-enumeration-probe]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-native
          cache-on-failure: true
      - name: Fetch and verify original core
        shell: pwsh
        run: ./src-native/fetch-core.ps1
      - name: Check HID protocol and queue lifecycle
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-native/crates/bud/Cargo.toml -p lowlat-client --features usb-hid-mouse hid_mouse -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'HID mouse unit tests failed' }
          cargo clippy --locked --manifest-path src-native/crates/bud/Cargo.toml -p lowlat-client --features usb-hid-mouse --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'HID mouse lint failed' }
      - name: Check settings and desktop input lifecycle
        shell: pwsh
        env:
          PARSEC_SETTINGS_SCREENSHOTS: ${{ github.workspace }}/dist/hid-ui
        run: |
          cargo test --locked --release --manifest-path src-native/Cargo.toml hid_input -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'HID input tests failed' }
          cargo test --locked --release --manifest-path src-native/Cargo.toml native_controls_save_and_reopen_without_guest_or_real_profile -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Settings UI tests failed' }
      - name: Build standalone client
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path src-native/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Client build failed' }
          New-Item -ItemType Directory -Path dist/hid-client -Force | Out-Null
          Copy-Item src-native/target/x86_64-pc-windows-msvc/release/parsec-web-turn.exe dist/hid-client/ParsecWebTurn.exe
          Get-FileHash dist/hid-client/ParsecWebTurn.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ParsecWebTurn-HID-Input-win64
          path: dist/hid-client/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HID-settings-screenshots
          path: dist/hid-ui/
          if-no-files-found: ignore
