name: Isolated USB mouse enumeration probe
on:
  workflow_dispatch:
  push:
    branches: [codex/usb-mouse-enumeration-probe]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-native
          cache-on-failure: true
      - name: Fetch and verify original core
        shell: pwsh
        run: ./src-native/fetch-core.ps1
      - name: Check probe framing and lifecycle
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-native/crates/bud/Cargo.toml -p lowlat-client --features usb-mouse-probe usb_mouse_probe -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'USB probe unit tests failed' }
          cargo clippy --locked --manifest-path src-native/crates/bud/Cargo.toml -p lowlat-client --features usb-mouse-probe --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'USB probe lint failed' }
      - name: Build opt-in client and read-only host observer
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path src-native/Cargo.toml --features usb-mouse-probe
          if ($LASTEXITCODE -ne 0) { throw 'Probe client build failed' }
          New-Item -ItemType Directory -Path dist/usb-mouse-probe -Force | Out-Null
          Copy-Item src-native/target/x86_64-pc-windows-msvc/release/parsec-web-turn.exe dist/usb-mouse-probe/ParsecWebTurn-USB-Probe.exe
          rustc --edition 2024 -C opt-level=s -C target-feature=+crt-static src-native/probes/usb-mouse-observer.rs -o dist/usb-mouse-probe/USB-Mouse-Observer.exe
          if ($LASTEXITCODE -ne 0) { throw 'Observer build failed' }
          Copy-Item scripts/usb-mouse-probe/*.cmd dist/usb-mouse-probe/
          Copy-Item docs/usb-mouse-probe.md dist/usb-mouse-probe/README.md
          Get-ChildItem dist/usb-mouse-probe/*.exe | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: USB-mouse-enumeration-probe-win64
          path: dist/usb-mouse-probe/
          if-no-files-found: error
