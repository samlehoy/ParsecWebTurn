name: EvoParseq Android TV preview

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['android-tv/**', '.github/workflows/android-tv.yml', 'src-native/src/**', 'src-native/vendor/**', 'src-native/crates/bud/**']

permissions:
  contents: read

concurrency:
  group: android-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android-tv/native
      - name: Verify shared Rust account and streaming core
        run: |
          cargo fmt --manifest-path android-tv/native/Cargo.toml -- --check
          cargo test --locked --manifest-path android-tv/native/Cargo.toml --target x86_64-unknown-linux-gnu
          cargo test --locked --manifest-path src-native/crates/bud/Cargo.toml -p evoparseq-bud --target x86_64-unknown-linux-gnu
          cargo clippy --locked --manifest-path android-tv/native/Cargo.toml --target x86_64-unknown-linux-gnu --all-targets -- -D warnings
      - name: Prepare Android toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build ARM64 and ARMv7 Rust adapters
        working-directory: android-tv/native
        run: |
          for abi in arm64-v8a armeabi-v7a; do
            mkdir -p "$RUNNER_TEMP/opus-$abi"
            export CMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/opus-$abi/android.toolchain.cmake"
            printf 'set(ANDROID_ABI "%s" CACHE STRING "")\nset(ANDROID_PLATFORM android-29 CACHE STRING "")\ninclude("%s/build/cmake/android.toolchain.cmake")\n' "$abi" "$ANDROID_NDK_HOME" > "$CMAKE_TOOLCHAIN_FILE"
            cargo ndk -t "$abi" --platform 29 -o ../app/src/main/jniLibs build --locked --release
            cargo ndk -t "$abi" --platform 29 clippy --locked -- -D warnings
          done
      - name: Restore protected release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD" || { echo 'Android release signing secrets are required'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/evoparseq-tv.p12"
          keytool -list -keystore "$RUNNER_TEMP/evoparseq-tv.p12" -storetype PKCS12 -storepass:env PASSWORD -alias evoparseq-tv > /dev/null
      - name: Build and lint TV application
        working-directory: android-tv
        env:
          ANDROID_TV_KEYSTORE: ${{ runner.temp }}/evoparseq-tv.p12
          ANDROID_TV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Verify signed APK
        run: '"$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android-tv/app/build/outputs/apk/release/app-release.apk'
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/evoparseq-tv.p12"
      - name: Describe preview artifact
        run: |
          mkdir -p dist/android-tv
          cp android-tv/app/build/outputs/apk/release/app-release.apk dist/android-tv/EvoParseq-TV.apk
          cp android-tv/README.md LICENSE dist/android-tv/
          cp src-native/crates/bud/vendor/lowlat-client/LICENSE dist/android-tv/LOWLAT-LICENSE.txt
          git rev-parse HEAD > dist/android-tv/SOURCE.txt
          sha256sum dist/android-tv/EvoParseq-TV.apk > dist/android-tv/SHA256.txt
          cp android-tv/app/build/reports/lint-results-release.html dist/android-tv/
      - uses: actions/upload-artifact@v4
        with:
          name: EvoParseq-Android-TV-preview
          path: dist/android-tv/*
          if-no-files-found: error
