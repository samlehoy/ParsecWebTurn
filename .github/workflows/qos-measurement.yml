name: Standalone Windows QoS measurement tool
on:
  workflow_dispatch:
  push:
    branches: [codex/native-core]
    paths: ['tools/qos-latency/**', '.github/workflows/qos-measurement.yml']
permissions:
  contents: read
concurrency:
  group: qos-tool-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/qos-latency
          cache-on-failure: true
      - name: Check isolated protocol and measurement tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --manifest-path tools/qos-latency/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting failed' }
          cargo clippy --locked --manifest-path tools/qos-latency/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
          cargo test --locked --manifest-path tools/qos-latency/Cargo.toml -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic protocol checks failed' }
          $env:QOS_TEST_SOURCE = '${{ github.sha }}'
          cargo build --locked --release --manifest-path tools/qos-latency/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Package portable measurement tool
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/qos-tool | Out-Null
          Copy-Item -LiteralPath tools/qos-latency/target/x86_64-pc-windows-msvc/release/evoparseq-qos-test.exe -Destination dist/qos-tool/EvoParseq-QoS-Test.exe
          Copy-Item -LiteralPath tools/qos-latency/README.md -Destination dist/qos-tool/README-hu.md
          Copy-Item -LiteralPath LICENSE -Destination dist/qos-tool/LICENSE.txt
          '${{ github.sha }}' | Set-Content -Encoding utf8 dist/qos-tool/SOURCE.txt
          cargo tree --locked --manifest-path tools/qos-latency/Cargo.toml | Set-Content -Encoding utf8 dist/qos-tool/dependencies.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency metadata failed' }
          $packages = (cargo metadata --locked --manifest-path tools/qos-latency/Cargo.toml --format-version 1 | ConvertFrom-Json).packages
          if ($LASTEXITCODE -ne 0) { throw 'License metadata failed' }
          foreach ($package in $packages) {
            $licenseFiles = Get-ChildItem -LiteralPath (Split-Path -Parent $package.manifest_path) -File | Where-Object Name -match '^(LICENSE|COPYING|NOTICE)'
            if ($licenseFiles) {
              $folder = Join-Path dist/qos-tool/third-party "$($package.name)-$($package.version)"
              New-Item -ItemType Directory -Force $folder | Out-Null
              foreach ($licenseFile in $licenseFiles) { Copy-Item -LiteralPath $licenseFile.FullName -Destination $folder }
            }
          }
          $hash = (Get-FileHash -Algorithm SHA256 dist/qos-tool/EvoParseq-QoS-Test.exe).Hash.ToLowerInvariant()
          "$hash  EvoParseq-QoS-Test.exe" | Set-Content -Encoding utf8 dist/qos-tool/SHA256.txt
          Compress-Archive -Path dist/qos-tool/* -DestinationPath dist/EvoParseq-QoS-Test-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EvoParseq-QoS-Test-win64
          path: dist/EvoParseq-QoS-Test-win64.zip
          if-no-files-found: error
