name: Bug report
description: Something is broken or behaving unexpectedly.
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    id: existing-issues
    attributes:
      label: Before reporting
      description: Search [open and closed issues](https://github.com/vampywiz17/ParsecWebTurn/issues?q=is%3Aissue) first.
      options:
        - label: I checked that this bug has not already been reported.
          required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Copy the version from About. For a test build, include its commit if known.
      placeholder: Stable/dev version or test-build commit
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem, what you expected, and how to reproduce it. If it happens only sometimes, mention that.
      placeholder: |
        Steps to reproduce:
        1.
        2.

        Expected:
        Actual (including any error message):
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Setup (optional)
      description: Share what you know; leave out anything unrelated or unknown.
      placeholder: |
        Windows version and GPU:
        WebRTC or BUD; direct or TURN:
        Relevant settings (codec, Zero copy, HID, etc.):
  - type: textarea
    id: attachments
    attributes:
      label: Logs or screenshots (optional)
      description: >-
        Attach a screenshot or client-events.jsonl if available. Enable event logging in
        Settings > Network, reproduce the problem, then find the log beside settings.json.
        Remove secrets and personal information; do not upload settings.json.
      placeholder: Drag files here, paste a screenshot, or include a short relevant log excerpt.
